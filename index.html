<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Farmacia Parecetaloka</title>
</head>

<body>
    <div>
        <h1>Farmácia Parecetaloka</h1>
        <form action="calcular.php" method="post">
            <label>Nome:</label>
            <input type="text" name="nome" id="nome" required>
            <br><br>
            <label>Total do pedido:</label>
            <input type="number" name="total" id="total" step="0.01" required>
            <br><br>
            <label>Faixa etária:</label>
            <br>
            <input type="radio" name="idade" id="idade" value="0" required>
            Menor de 50
            <br>
            <input type="radio" name="idade" id="idade" value="1" required>
            51 á 70
            <br>
            <input type="radio" name="idade" id="idade" value="2" required>
            Maior de 70
            <br><br>
            <input type="checkbox" name="cartao" id="cartao" value="sim">
            Cartão fidelidade
            <br><br>
            <input type="submit" value="Calcular">
            <input type="reset" value="Limpar">
        </form>
    </div>
</body>

</html>
